<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epochia</title>
  <meta http-equiv="refresh" content="0; url=neu/">
  <link rel="canonical" href="neu/">
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 3em"><a href="neu/">Weiter zu Epochia</a></p>
  <script>
    // Das alte Spiel liegt im Archiv: seinen Service Worker abmelden, dann weiter zu Epochia (Spielstände bleiben unberührt)
    const weiter = () => location.replace('neu/' + location.search);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration('./').then(r => (r && new URL(r.scope).pathname === location.pathname.replace(/[^/]*$/, '') ? r.unregister() : null)).catch(() => {}).finally(weiter);
    } else weiter();
  </script>
</body>
</html>
